<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Member')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('members')}"></header>

<main class="container narrow">
    <div class="page-head">
        <h1 th:text="${member.id == null} ? 'Register a member' : 'Edit member'">Register a member</h1>
    </div>

    <form class="card form"
          th:action="${member.id == null} ? @{/members} : @{/members/{id}(id=${member.id})}"
          th:object="${member}" method="post">

        <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
        </div>

        <label>Full name
            <input type="text" th:field="*{name}" maxlength="120" autofocus>
            <span class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>

        <label>Email
            <input type="email" th:field="*{email}" maxlength="150">
            <span class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>

        <label>Phone <small>(optional)</small>
            <input type="tel" th:field="*{phone}" maxlength="20">
            <span class="err" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </label>

        <div class="form-actions">
            <button class="btn primary" type="submit">Save member</button>
            <a class="btn ghost" th:href="@{/members}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
