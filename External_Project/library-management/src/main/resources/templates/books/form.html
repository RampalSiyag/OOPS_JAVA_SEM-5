<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('books')}"></header>

<main class="container narrow">
    <div class="page-head">
        <h1 th:text="${book.id == null} ? 'Add a book' : 'Edit book'">Add a book</h1>
    </div>

    <form class="card form"
          th:action="${book.id == null} ? @{/books} : @{/books/{id}(id=${book.id})}"
          th:object="${book}" method="post">

        <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
        </div>

        <label>Title
            <input type="text" th:field="*{title}" maxlength="200" autofocus>
            <span class="err" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </label>

        <label>Author
            <input type="text" th:field="*{author}" maxlength="120">
            <span class="err" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
        </label>

        <div class="grid-2">
            <label>ISBN
                <input type="text" th:field="*{isbn}" maxlength="20">
                <span class="err" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
            </label>

            <label>Category
                <input type="text" th:field="*{category}" maxlength="60" placeholder="e.g. Fiction">
                <span class="err" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
            </label>
        </div>

        <label>Total copies
            <input type="number" th:field="*{totalCopies}" min="1">
            <span class="err" th:if="${#fields.hasErrors('totalCopies')}" th:errors="*{totalCopies}"></span>
        </label>

        <div class="form-actions">
            <button class="btn primary" type="submit">Save book</button>
            <a class="btn ghost" th:href="@{/books}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
