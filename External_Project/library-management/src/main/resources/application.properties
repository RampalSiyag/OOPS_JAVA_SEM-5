spring.application.name=library-management
server.port=8080

# Default database: file-based H2 (stored in ./data, no installation needed)
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console (JDBC URL above, user "sa", empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Insert sample books, members and loans when the database is empty
app.seed-data=true
