# Activate with:  java -jar target/library-management-1.0.0.jar --spring.profiles.active=mysql
# Set DB_USERNAME / DB_PASSWORD as environment variables (defaults: root / empty).
spring.datasource.url=jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false
